name: Bug report
description: 报告一个可以复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清楚描述实际行为和预期行为。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v0.1.0 或 commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS
        - Windows
        - Linux
        - Web
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小复现步骤。不要粘贴密码、Token 或 Tunnel credentials。
    validations:
      required: true
